<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="workSpace">
        <div class="mainConteiner">
            <div class="currentDate">
                <h4>Среда</h4>
                <p>9 Sep</p>
            </div>
            <div class="find">
                <input class="findInput" type="text" placeholder="Поиск">
                <button class="findBtn">
                    <img src="/assets/icons/find.svg" alt="Поиск">
                </button>
            </div>
            <div class="tabs">
                <button id="tabAll">
                    <span class="check">✓</span>
                    Все
                </button>

                <button id="tabActive">
                    Активные
                </button>

                <button id="tabEnded">
                    Завершенные
                </button>
            </div>
            <ul id="taskList">
                <li>
                    <input type="checkbox">
                    <div class="task">
                        <span class="task-date">10 сентября 2026</span>
                        <span class="task-name">Выучить CSS Grid</span>

                    </div>
                </li>
            </ul>



        </div>

        <form class="formAddTask" action="formAddTask">
            <div class="onlyLine"><img src="/assets/icons/Frame 17.svg" alt=""></div>
            <input class="inpBox" type="text" placeholder="Описание" name="v_login">
            <input class="datetime" type="datetime" placeholder="Дата и время" name="v_password">
            <div class="switchCont">
                <span>Напомнить мне</span>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
            <div>
                <input class="addTaskBtn" type="submit" value="Добавить">
                <input class="cancelBtn" type="reset" value="Отмена">
            </div>


        </form>
    </div>

</body>
<script src="/scripts/script.js"></script>

</html>
