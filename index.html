<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="workSpace">
        <div class="mainConteiner">
            <div class="currentDate">
                <h4>Среда</h4>
                <p>9 Sep</p>
            </div>
            <div class="find">
                <input class="findInput" type="text" placeholder="Поиск">
                <button class="findBtn">
                    <img src="/assets/icons/find.svg" alt="Поиск">
                </button>
            </div>
            <div class="tabs">
                <button class="filtred" id="tabAll">
                    <span id="spanAll">✓</span>
                    Все
                </button>

                <button id="tabActive">
                    <span id="spanActive"></span>
                    Активные
                </button>

                <button id="tabEnded">
                    <span id="spanEnded"></span>
                    Завершенные
                </button>
            </div>
            <ul id="taskList">
                <!-- <li class="oneTask">
                    <input type="checkbox">
                    <div class="taskInfo">
                        <span class="taskDate">10 сентября 2026</span>
                        <span class="taskName">Выучить CSS Grid</span>
                    </div>
                </li> -->
            </ul>



        </div>
        <button id="pencilBtn"><img src="assets/icons/pencil.svg" alt="Добавить"></button>
        <form class="formAddTask hidden" action="formAddTask">
            <div class="onlyLine"><img src="/assets/icons/Frame 17.svg" alt=""></div>
            <input class="textTask" type="text" placeholder="Описание" name="textTask">
            <input class="dateTimeTask" type="datetime-local" placeholder="Дата и время" name="dateTimeTask">
            <p class="OKMassage" id="textStatusMessage"></p>

            <div class="switchCont">
                <span>Напомнить мне</span>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="contForBtn">
                <input id="addTaskBtn" type="submit" value="Добавить">
                <input id="cancelBtn" type="reset" value="Отмена">
            </div>

        </form>
    </div>

</body>
<script src="/scripts/script.js"></script>

</html>
